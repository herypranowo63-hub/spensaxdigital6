<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Spensax Digital</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f0f2f5; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #1a73e8; text-align: center; margin-top: 0; }
        textarea { width: 100%; height: 100px; padding: 12px; border: 1px solid #ddd; border-radius: 10px; resize: none; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 10px; margin-top: 10px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background-color: #1557b0; }
        #output { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 10px; font-size: 14px; line-height: 1.5; color: #333; min-height: 50px; border-left: 5px solid #1a73e8; }
    </style>
</head>
<body>

<div class="card">
    <h2>Spensax AI</h2>
    <textarea id="prompt" placeholder="Tanya sesuatu ke AI..."></textarea>
    <button onclick="askAI()" id="btn">Kirim Pertanyaan</button>
    <div id="output">Hasil akan muncul di sini...</div>
</div>

<script type="module">
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    // API Key kamu sudah saya masukkan di sini
    const genAI = new GoogleGenerativeAI("AIzaSyAev7JhjeQMBXV2VD_7eaqsd1gR7YoQH-Q");

    window.askAI = async () => {
        const promptInput = document.getElementById("prompt").value;
        const outputDiv = document.getElementById("output");
        const btn = document.getElementById("btn");

        if (!promptInput) return alert("Ketik sesuatu dulu!");

        outputDiv.innerText = "Sedang berpikir...";
        btn.disabled = true;

        try {
            const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
            const result = await model.generateContent(promptInput);
            const response = await result.response;
            outputDiv.innerText = response.text();
        } catch (error) {
            console.error(error);
            outputDiv.innerText = "Maaf, ada kendala koneksi atau API Key sedang diproses oleh Google. Coba lagi dalam 1 menit.";
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
